<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小智控制台</title>
<style>
  :root {
    --blue: #1a56db;
    --blue-dark: #1646b8;
    --black: #111827;
    --black-soft: #1f2937;
    --white: #ffffff;
    --gray: #6b7280;
    --line: #e5e7eb;
    --bg: #f3f4f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--black); background: var(--bg); font-size: 14px; }
  .layout { display: flex; min-height: 100vh; }

  .sidebar { width: 224px; background: var(--black); color: #fff; flex-shrink: 0; display: flex; flex-direction: column; }
  .logo { height: 64px; display: flex; align-items: center; padding: 0 20px; font-size: 16px; font-weight: 700; border-bottom: 1px solid #374151; gap: 10px; }
  .logo-mark { width: 28px; height: 28px; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .nav { padding: 12px 0; flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 20px; color: #9ca3af; cursor: pointer; border-left: 3px solid transparent; user-select: none; }
  .nav-item:hover { background: var(--black-soft); color: #fff; }
  .nav-item.active { background: var(--black-soft); color: #fff; border-left-color: var(--blue); }
  .nav-icon { width: 18px; text-align: center; font-size: 15px; }
  .sidebar-foot { padding: 16px 20px; border-top: 1px solid #374151; color: #6b7280; font-size: 12px; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 64px; background: var(--white); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }
  .crumb { font-size: 16px; font-weight: 600; }
  .user { display: flex; align-items: center; gap: 10px; color: var(--gray); }
  .avatar { width: 32px; height: 32px; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }

  .content { padding: 28px; flex: 1; }
  .page { display: none; }
  .page.active { display: block; }
  .page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .page-head h1 { font-size: 20px; }
  .page-head p { color: var(--gray); font-size: 13px; margin-top: 4px; }

  .btn { padding: 9px 18px; border: 1px solid var(--blue); background: var(--blue); color: var(--white); cursor: pointer; font-size: 14px; }
  .btn:hover { background: var(--blue-dark); }
  .btn.ghost { background: var(--white); color: var(--black); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--blue); color: var(--blue); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat { background: var(--white); border: 1px solid var(--line); padding: 20px; }
  .stat-label { color: var(--gray); font-size: 13px; }
  .stat-value { font-size: 28px; font-weight: 700; margin-top: 8px; }

  .section-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .agent { background: var(--white); border: 1px solid var(--line); padding: 20px; }
  .agent-top { display: flex; align-items: center; gap: 12px; }
  .agent-avatar { width: 44px; height: 44px; background: var(--black); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; }
  .agent-name { font-size: 15px; font-weight: 600; }
  .agent-meta { color: var(--gray); font-size: 12px; margin-top: 3px; }
  .agent-desc { color: var(--gray); font-size: 13px; margin: 14px 0; line-height: 1.5; }
  .agent-foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
  .badge { font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); color: var(--gray); }
  .badge.on { border-color: var(--blue); color: var(--blue); }

  table { width: 100%; border-collapse: collapse; background: var(--white); border: 1px solid var(--line); }
  th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  th { color: var(--gray); font-weight: 500; font-size: 13px; background: #f9fafb; }

  .placeholder { background: var(--white); border: 1px solid var(--line); padding: 60px 20px; text-align: center; color: var(--gray); }
  .placeholder .big { font-size: 34px; color: var(--line); margin-bottom: 12px; }
  .placeholder h3 { color: var(--black); font-size: 16px; margin-bottom: 6px; }

  @media (max-width: 820px) {
    .sidebar { width: 60px; }
    .logo-text, .nav-text, .sidebar-foot { display: none; }
    .nav-item { justify-content: center; padding: 12px 0; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .cards { grid-template-columns: 1fr; }
