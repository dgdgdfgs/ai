<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 控制台</title>
<style>
:root{--blue:#1a56db;--blue-d:#1646b8;--black:#111827;--white:#fff;--line:#e5e7eb;--muted:#6b7280;--bg:#f5f6f8;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--black);font-size:14px}
.auth-card{max-width:380px;margin:9vh auto;background:var(--white);border:1px solid var(--line);padding:32px}
.auth-card h2{text-align:center;margin:0 0 24px;font-size:20px}
.auth-tabs{position:relative;display:flex;border-bottom:1px solid var(--line);margin-bottom:22px}
.auth-tabs>div:not(.auth-slider){flex:1;text-align:center;padding:10px;cursor:pointer;color:var(--muted);transition:color .25s ease}
.auth-tabs>div:not(.auth-slider).active{color:var(--blue);font-weight:700}
.auth-slider{position:absolute;bottom:-1px;left:0;width:50%;height:2px;padding:0;box-sizing:border-box;background:var(--blue);transition:transform .28s ease}
.auth-slider.sms{transform:translateX(0)}
.auth-slider.pwd{transform:translateX(100%)}
.auth-form{display:none}
.auth-form.active{display:block;animation:fade .25s ease}
.code-row{display:flex;gap:10px;align-items:stretch}
.code-row input{flex:1}
.code-row button{width:120px;padding:0 8px;white-space:nowrap;font-size:13px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.field label{font-size:12px;color:var(--muted)}
input,select{width:100%;padding:10px;border:1px solid var(--line);background:var(--white);color:var(--black);font-size:14px;outline:none;border-radius:0;transition:border-color .18s}
input:focus,select:focus{border-color:var(--blue)}
.cap-row{display:flex;gap:10px;align-items:stretch}
.cap-row input{flex:1}
.cap-box{width:130px;height:42px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:#eee}
.cap-box svg{height:100%;width:100%}
button{padding:10px 18px;border:1px solid var(--blue);background:var(--blue);color:var(--white);cursor:pointer;font-size:14px;transition:background .18s,border-color .18s}
button:hover{background:var(--blue-d);border-color:var(--blue-d)}
button:disabled{opacity:.6;cursor:not-allowed}
button.block{width:100%;margin-top:6px}
button.ghost{background:var(--white);color:var(--black);border-color:var(--line)}
button.ghost:hover{color:var(--blue);border-color:var(--blue);background:var(--white)}
button.danger{background:var(--white);color:var(--black);border-color:var(--line)}
button.danger:hover{background:var(--black);border-color:var(--black);color:var(--white)}
button.small{padding:5px 10px;font-size:12px}
.msg{font-size:13px;min-height:18px;margin-top:10px;text-align:center;color:var(--red)}
.app{display:none;max-width:1080px;margin:0 auto;padding:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;background:var(--white);border:1px solid var(--line);padding:14px 20px;margin-bottom:20px}
.topbar h1{margin:0;font-size:18px;color:var(--blue)}
.topbar .right{display:flex;align-items:center;gap:12px}
.topbar .user{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs div{padding:10px 20px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:color .18s,border-color .18s}
.tabs div.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.panel{display:none;background:var(--white);border:1px solid var(--line);padding:20px}
.panel.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel h2{font-size:15px;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.row .field{margin-bottom:0;flex:1 1 180px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.empty{color:var(--muted);padding:14px 0;text-align:center}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--black);color:var(--white);padding:10px 18px;font-size:13px;z-index:99;display:none;max-width:90vw}
.tag{display:inline-block;padding:2px 8px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.loading{color:var(--muted);padding:14px 0;text-align:center}
.act{display:flex;gap:6px;flex-wrap:wrap}
.btn-new{float:right;margin-top:-2px}
.panel h2::after{content:"";display:block;clear:both}
.mask{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.mask.active{display:flex}
.modal{background:var(--white);border:1px solid var(--line);width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:24px}
.modal h3{margin:0 0 18px;font-size:16px;color:var(--blue)}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
textarea{width:100%;padding:10px;border:1px solid var(--line);background:var(--white);color:var(--black);font-size:14px;outline:none;resize:vertical;min-height:80px;font-family:inherit;transition:border-color .18s}
textarea:focus{border-color:var(--blue)}
.search{display:flex;gap:10px;margin-bottom:14px}
.search input{flex:1}
.tip{font-size:12px;color:var(--muted);line-height:1.6;margin:12px 0 0}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.fixed{table-layout:fixed;width:100%}
table.fixed th,table.fixed td{word-break:break-all;overflow-wrap:anywhere;vertical-align:top}
</style>
</head>
<body>

<div id="authPage" class="auth-card">
  <h2>AI 控制台</h2>
  <div class="auth-tabs">
    <div id="tabSms" class="active" onclick="switchAuth('sms')">短信验证码</div>
    <div id="tabPwd" onclick="switchAuth('pwd')">用户名密码</div>
    <div id="authSlider" class="auth-slider sms"></div>
  </div>

  <div id="formSms" class="auth-form active">
    <div class="field"><label>手机号</label>
      <div class="code-row">
        <select id="cc" style="width:92px;flex:none" onchange="onCcChange()">
          <option value="+86">+86</option>
          <option value="+852">+852</option>
          <option value="+853">+853</option>
          <option value="+886">+886</option>
          <option value="+1">+1</option>
          <option value="+81">+81</option>
          <option value="+82">+82</option>
          <option value="+65">+65</option>
        </select>
        <input id="phone" inputmode="numeric" placeholder="手机号" style="flex:1" />
      </div>
    </div>
    <div class="field"><label>图形验证码</label>
      <div class="cap-row">
        <input id="smsGraphic" maxlength="8" placeholder="输入右侧字符" />
        <div class="cap-box" id="capBoxSms" title="点击刷新"></div>
      </div>
    </div>
    <div class="field"><label>短信验证码</label>
      <div class="code-row">
        <input id="smsCode" inputmode="numeric" maxlength="6" placeholder="6 位短信验证码" />
        <button id="sendBtn" onclick="sendSmsCode()">发送验证码</button>
      </div>
    </div>
    <button id="smsLoginBtn" class="block" onclick="doPhoneLogin()">登录</button>
  </div>

  <div id="formPwd" class="auth-form">
    <div class="field"><label>用户名</label><input id="username" autocomplete="username" /></div>
    <div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" /></div>
    <div class="field"><label>图形验证码</label>
      <div class="cap-row">
        <input id="captcha" maxlength="8" placeholder="输入右侧字符" />
        <div class="cap-box" id="capBox" title="点击刷新"></div>
      </div>
    </div>
    <button id="loginBtn" class="block" onclick="doLogin()">登录</button>
  </div>

  <div id="authMsg" class="msg"></div>
</div>

<div id="appPage" class="app">
  <div class="topbar">
    <h1>AI 控制台</h1>
    <div class="right">
      <span class="user" id="who"></span>
      <button class="ghost small" onclick="doLogout()">退出</button>
    </div>
  </div>
  <div class="tabs">
    <div id="tabAgent" class="active" onclick="switchPanel('agent')">智能体</div>
    <div id="tabDevice" onclick="switchPanel('device')">设备管理</div>
    <div id="tabApi" onclick="switchPanel('api')">自定义API</div>
  </div>

  <div id="panelAgent" class="panel active">
    <h2>智能体列表 <button class="small btn-new" onclick="openCreate()">+ 新建智能体</button></h2>
    <div class="search"><input id="agentSearch" placeholder="搜索智能体名称" onkeydown="if(event.key==='Enter')loadAgents()" /><button class="ghost small" onclick="loadAgents()">搜索</button></div>
    <div id="agentList"><div class="loading">加载中...</div></div>
  </div>

  <div id="panelDevice" class="panel">
    <h2>设备绑定</h2>
    <div class="row">
      <div class="field"><label>选择智能体</label><select id="agentSel" onchange="loadDevices()"></select></div>
    </div>
    <div class="row">
      <div class="field"><label>设备验证码(板子屏幕显示的 6 位码)</label><input id="devCode" placeholder="输入板子屏幕上显示的验证码" /></div>
      <button onclick="bindDevice()">绑定设备</button>
    </div>
    <div class="row"><button class="ghost" onclick="loadDevices()">刷新列表</button></div>
    <div id="devList"><div class="empty">请先选择智能体</div></div>
  </div>

  <div id="panelApi" class="panel">
    <h2>自定义 API 配置 <button class="small btn-new" onclick="openApiAdd()">+ 添加</button></h2>
    <div id="apiList"><div class="empty">暂无自定义 API</div></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<div id="mask" class="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modalTitle">新建智能体</h3>
    <div id="modalBody"></div>
    <div class="foot">
      <button class="ghost" onclick="closeModal()">取消</button>
      <button id="modalOk" onclick="modalSubmit()">确定</button>
    </div>
  </div>
</div>

<script>
var API_BASE = '/api';
var TOKEN_KEY = 'ai_console_token';
var $ = function(id){ return document.getElementById(id); };
var captchaId = '';

function toast(msg){
  var t=$('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._t); t._t=setTimeout(function(){ t.style.display='none'; },2600);
}
function getToken(){ var raw=localStorage.getItem(TOKEN_KEY); if(!raw) return ''; try{return JSON.parse(raw).token||'';}catch(e){return '';} }

function api(path, method, body, skipAuth){
  var headers={'Content-Type':'application/json'};
  if(!skipAuth && getToken()) headers['Authorization']='Bearer '+getToken();
  var opt={method:method||'GET',headers:headers};
  if(body!==undefined && body!==null) opt.body=JSON.stringify(body);
  return fetch(API_BASE+path,opt).then(function(r){return r.json().catch(function(){return {success:false,message:'HTTP '+r.status};});})
    .then(function(res){
      if(res.success===false){
        if(/token|登录|unauthor|expired/i.test(res.message||'')){ localStorage.removeItem(TOKEN_KEY); showAuth(); }
        throw new Error(res.message||'请求失败');
      }
      return res.data;
    });
}

function loadCaptcha(){
  fetch(API_BASE+'/auth/captcha?format=json',{cache:'no-store'}).then(function(r){return r.json();})
    .then(function(res){
      if(!res.success) throw new Error(res.message||'验证码加载失败');
      captchaId=res.data.captcha_id;
      $('capBox').innerHTML=res.data.svg;
      $('capBoxSms').innerHTML=res.data.svg;
    })
    .catch(function(e){ $('capBox').textContent='点击刷新'; $('capBoxSms').textContent='点击刷新'; $('authMsg').textContent='验证码加载失败,点击重试'; });
}
$('capBox').onclick=loadCaptcha;
$('capBoxSms').onclick=loadCaptcha;

var authMode='sms';
function switchAuth(mode){
  authMode=mode;
  $('tabSms').classList.toggle('active',mode==='sms');
  $('tabPwd').classList.toggle('active',mode==='pwd');
  $('authSlider').className='auth-slider '+mode;
  $('formSms').classList.toggle('active',mode==='sms');
  $('formPwd').classList.toggle('active',mode==='pwd');
  $('authMsg').textContent='';
  loadCaptcha();
}
function onCcChange(){ $('authMsg').textContent=''; }
function fullPhone(){
  return $('cc').value + $('phone').value.replace(/\D/g,'');
}
function validPhone(p,cc){
  if(cc==='+86') return /^1[3-9]\d{9}$/.test(p);
  if(cc==='+852'||cc==='+853') return /^\d{8}$/.test(p);
  if(cc==='+886') return /^\d{9}$/.test(p);
  return /^\d{5,15}$/.test(p);
}

var smsCountdown=0;
function sendSmsCode(){
  var cc=$('cc').value, num=$('phone').value.trim(), g=$('smsGraphic').value.trim();
  if(!validPhone(num,cc)){ $('authMsg').textContent='请输入正确的手机号'; return; }
  if(cc==='+86'){
    if(g.length!==4){ $('authMsg').textContent='请输入 4 位图形验证码'; return; }
  }
  if(smsCountdown>0) return;
  $('sendBtn').disabled=true; $('authMsg').textContent='发送中...';
  var body={phone:fullPhone()};
  if(cc==='+86'){ body.captcha_code=g; body.captcha_id=captchaId; }
  api('/auth/send-code','POST',body,true)
    .then(function(){
      $('authMsg').textContent='验证码已发送';
      smsCountdown=60;
      var t=setInterval(function(){
        smsCountdown--;
        $('sendBtn').textContent=smsCountdown>0?('重发('+smsCountdown+'s)'):'发送验证码';
        if(smsCountdown<=0){ clearInterval(t); $('sendBtn').disabled=false; }
      },1000);
    })
    .catch(function(e){ $('authMsg').textContent=e.message; $('sendBtn').disabled=false; loadCaptcha(); });
}

function doPhoneLogin(){
  var code=$('smsCode').value.trim(), num=$('phone').value.trim(), cc=$('cc').value;
  if(!validPhone(num,cc)){ $('authMsg').textContent='请输入正确的手机号'; return; }
  if(!/^\d{6}$/.test(code)){ $('authMsg').textContent='请输入 6 位短信验证码'; return; }
  $('smsLoginBtn').disabled=true; $('authMsg').textContent='登录中...';
  api('/auth/phone-login','POST',{phone:fullPhone(),code:code},true)
    .then(function(data){
      var token=data.token||data.access_token||(data.user&&data.user.token);
      if(!token) throw new Error('登录未返回凭证');
      localStorage.setItem(TOKEN_KEY,JSON.stringify({token:token}));
      $('authMsg').textContent=''; $('smsCode').value='';
      showApp();
    })
    .catch(function(e){ $('authMsg').textContent=e.message; $('smsLoginBtn').disabled=false; });
}

function doLogin(){
  var u=$('username').value.trim(),p=$('password').value,c=$('captcha').value.trim();
  if(!u||!p||!c){ $('authMsg').textContent='请填写用户名、密码和验证码'; return; }
  $('loginBtn').disabled=true; $('authMsg').textContent='登录中...';
  api('/auth/login','POST',{username:u,password:p,captcha_code:c,captcha_id:captchaId},true)
    .then(function(data){
      var token=data.token||data.access_token||(data.user&&data.user.token);
      if(!token) throw new Error('登录未返回凭证');
      localStorage.setItem(TOKEN_KEY,JSON.stringify({token:token}));
      $('authMsg').textContent=''; $('password').value=''; $('captcha').value='';
      showApp();
    })
    .catch(function(e){ $('authMsg').textContent=e.message; $('loginBtn').disabled=false; loadCaptcha(); });
}

function doLogout(){
  api('/auth/logout','POST',{},false).catch(function(){});
  localStorage.removeItem(TOKEN_KEY); showAuth();
}

function showAuth(){
  $('appPage').style.display='none'; $('authPage').style.display='block';
  $('loginBtn').disabled=false; $('smsLoginBtn').disabled=false;
  $('sendBtn').disabled=false; $('sendBtn').textContent='发送验证码'; smsCountdown=0;
  switchAuth('sms');
}
function showApp(){
  $('authPage').style.display='none'; $('appPage').style.display='block';
  api('/auth/me').then(function(me){ $('who').textContent=(me&&(me.username||me.nickname||me.phone))||'已登录'; }).catch(function(){});
  loadAgents();
}

function switchPanel(name){
  ['agent','device','api'].forEach(function(n){
    $('panel'+cap(n)).classList.toggle('active',n===name);
    $('tab'+cap(n)).classList.toggle('active',n===name);
  });
  if(name==='api') renderApi();
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function extractVoices(data){
  var out=[], seen={};
  function add(v,lang){
    if(!v||typeof v!=='object') return;
    var id=v.voice_id||v.voice||v.speaker_id||v.id||v.code||'';
    if(!id) return;
    var key=String(id)+'_'+(lang||'');
    if(seen[key]) return; seen[key]=1;
    out.push({id:String(id),name:v.name||v.alias||v.voice_name||v.speaker||String(id),lang:lang||''});
  }
  function walk(n,lang){
    if(!n||typeof n!=='object') return;
    if(Array.isArray(n)){ n.forEach(function(x){walk(x,lang);}); return; }
    if('voice_id' in n||'speaker_id' in n||'voice' in n){ add(n,lang); }
    var L=n.languages;
    if(Array.isArray(L)){
      L.forEach(function(l){
        var name=typeof l==='string'?l:(l&&(l.name||l.code||l.lang))||'';
        if(n.tts_voices&&n.tts_voices[name]) walk(n.tts_voices[name],name);
        if(l&&typeof l==='object') walk(l,name);
      });
    } else if(L&&typeof L==='object'){
      Object.keys(L).forEach(function(k){ walk(L[k],k); });
    }
    if(n.tts_voices&&typeof n.tts_voices==='object'){
      Object.keys(n.tts_voices).forEach(function(k){ walk(n.tts_voices[k],k); });
    }
    if(Array.isArray(n.voices)) walk(n.voices,n.lang||n.language||lang);
    ['ttsList','list','items','data','ttsList'].forEach(function(k){ if(n[k]) walk(n[k],lang); });
  }
  walk(data,'');
  return out;
}

var agents=[];
function loadAgents(){
  $('agentList').innerHTML='<div class="loading">加载中...</div>';
  var kw=($('agentSearch').value||'').trim();
  var q='/agents?page=1&pageSize=50&summary=true'+(kw?'&keyword='+encodeURIComponent(kw):'');
  api(q).then(function(data){
    var list=Array.isArray(data)?data:(data&&(data.agents||data.list||data.items))||[];
    agents=list;
    if(!list.length){ $('agentList').innerHTML='<div class="empty">暂无智能体,点右上角新建</div>'; fillAgentSel(); return; }
    var h='<table><thead><tr><th>名称</th><th>ID</th><th>操作</th></tr></thead><tbody>';
    list.forEach(function(a){
      var id=a.id||a.agent_id;
      h+='<tr><td>'+esc(a.name||a.agent_name||'未命名')+'</td><td class="mono">'+esc(id)+'</td>'
        +'<td><div class="act">'
        +'<button class="small ghost" onclick="openConfig('+esc(id)+')">配置</button>'
        +'<button class="small ghost" onclick="openRename('+esc(id)+')">改名</button>'
        +'<button class="small ghost" onclick="goDevices('+esc(id)+')">设备</button>'
        +'<button class="small danger" onclick="delAgent('+esc(id)+')">删除</button>'
        +'</div></td></tr>';
    });
    $('agentList').innerHTML=h+'</tbody></table>';
    fillAgentSel();
  }).catch(function(e){ $('agentList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; });
}

var modalAction=null;
function openModal(title,bodyHtml,okText,action){
  $('modalTitle').textContent=title;
  $('modalBody').innerHTML=bodyHtml;
  $('modalOk').textContent=okText||'确定';
  modalAction=action;
  $('mask').classList.add('active');
}
function closeModal(){ $('mask').classList.remove('active'); modalAction=null; }
function modalSubmit(){ if(modalAction) modalAction(); }

function openCreate(){
  openModal('新建智能体',
    '<div class="field"><label>智能体名称</label><input id="mName" placeholder="给智能体起个名字" /></div>',
    '创建', function(){
      var n=$('mName').value.trim();
      if(!n){ toast('请输入名称'); return; }
      $('modalOk').disabled=true;
      api('/agents','POST',{agent_name:n}).then(function(){ closeModal(); toast('创建成功'); loadAgents(); })
        .catch(function(e){ toast(e.message); $('modalOk').disabled=false; });
    });
}
function openRename(id){
  var cur='';
  for(var i=0;i<agents.length;i++){ var a=agents[i]; if(String(a.id||a.agent_id)===String(id)){ cur=a.name||a.agent_name||''; break; } }
  openModal('重命名智能体',
    '<div class="field"><label>新名称</label><input id="mName" value="'+esc(cur)+'" /></div>',
    '保存', function(){
      var n=$('mName').value.trim();
      if(!n){ toast('请输入名称'); return; }
      api('/agents/update-name','POST',{id:Number(id),name:n}).then(function(){ closeModal(); toast('已改名'); loadAgents(); })
        .catch(function(e){ toast(e.message); });
    });
}
function delAgent(id){
  if(!confirm('确定删除这个智能体?该操作不可恢复。')) return;
  api('/agents/delete','POST',{id:Number(id)}).then(function(){ toast('已删除'); loadAgents(); })
    .catch(function(e){ toast(e.message); });
}

var cfgResources=null;
function openConfig(id){
  openModal('智能体配置','<div class="loading">加载配置中...</div>','保存',function(){});
  Promise.all([
    api('/agents/'+encodeURIComponent(id)),
    api('/user/tts-list').catch(function(){ return api('/roles/tts-list').catch(function(){return {}; }); })
  ]).then(function(res){
    var agent=(res[0]&&res[0].agent)||res[0]||{};
    var voices=extractVoices(res[1]);
    var langOpts='';
    var langSet={}; voices.forEach(function(v){ if(v.lang) langSet[v.lang]=1; });
    Object.keys(langSet).forEach(function(l){ langOpts+='<option value="'+esc(l)+'">'+esc(l)+'</option>'; });
    var voiceOpts=voices.map(function(v){return '<option value="'+esc(v.id)+'">'+esc(v.name)+' ('+esc(v.lang)+')</option>';}).join('');
    var modelOpts='';
    getApis().forEach(function(x){
      var label=x.name||x.model||'';
      var val=x.model||x.base||'';
      if(!val) return;
      modelOpts+='<option value="'+esc(val)+'">'+esc(label)+'</option>';
    });
    var curLang=agent.language||(voices[0]&&voices[0].lang)||'';
    var curVoice=agent.tts_voice||'';
    var curModel=agent.llm_model||'';
    var curAsr=agent.asr_speed||'normal';
    var curSpeed=agent.tts_speech_speed||'normal';
    var curPitch=Number(agent.tts_pitch)||0;
    function speedOpts(cur){
      return [['slow','慢'],['normal','正常'],['fast','快']].map(function(p){
        return '<option value="'+p[0]+'"'+(cur===p[0]?' selected':'')+'>'+p[1]+'</option>';
      }).join('');
    }
    var body=''
      +'<div class="field"><label>语言模型</label><select id="cModel"><option value="">默认</option>'+modelOpts+'</select></div>'
      +'<div class="field"><label>语言</label><select id="cLang" onchange="filterVoices()">'+langOpts+'</select></div>'
      +'<div class="field"><label>音色</label><select id="cVoice"><option value="">默认</option>'+voiceOpts+'</select></div>'
      +'<div class="field"><label>角色设定(提示词)</label><textarea id="cChar" placeholder="描述智能体的性格、身份、说话风格...">'+esc(agent.character||'')+'</textarea></div>'
      +'<div class="row">'
      +'<div class="field"><label>识别速度</label><select id="cAsr">'+speedOpts(curAsr)+'</select></div>'
      +'<div class="field"><label>语速</label><select id="cSpeed">'+speedOpts(curSpeed)+'</select></div>'
      +'</div>'
      +'<div class="field"><label>音调(-3 到 3)</label><input id="cPitch" type="number" min="-3" max="3" step="1" value="'+curPitch+'" /></div>'
      +'<div class="field"><label>记忆</label><select id="cMem"><option value="OFF">关闭</option><option value="SHORT_TERM">短期记忆</option><option value="LONG_TERM">长期记忆</option></select></div>';
    cfgResources={voices:voices,agent:agent};
    $('modalTitle').textContent='智能体配置';
    $('modalBody').innerHTML=body;
    if(curModel) $('cModel').value=curModel;
    if(curLang) $('cLang').value=curLang;
    filterVoices();
    if(curVoice) $('cVoice').value=curVoice;
    var mt=agent.memory_type||'OFF';
    if(mt==='SHORT_TERM'||mt==='LONG_TERM') $('cMem').value=mt;
    $('modalOk').disabled=false;
    modalAction=function(){
      var pitch=Number($('cPitch').value);
      if(isNaN(pitch)||pitch< -3||pitch>3) pitch=0;
      var payload={
        language:$('cLang').value,
        tts_voice:$('cVoice').value,
        character:$('cChar').value.trim()||null,
        asr_speed:$('cAsr').value,
        tts_speech_speed:$('cSpeed').value,
        tts_pitch:pitch,
        llm_model:$('cModel').value,
        memory_type:$('cMem').value,
        teen_mode:false,
        mcp_endpoints:[],
        knowledge_base_ids:[]
      };
      $('modalOk').disabled=true;
      api('/agents/'+encodeURIComponent(id)+'/config','POST',payload).then(function(){ closeModal(); toast('配置已保存'); })
        .catch(function(e){ toast(e.message); $('modalOk').disabled=false; });
    };
  }).catch(function(e){ $('modalBody').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; });
}
function filterVoices(){
  if(!cfgResources||!$('cVoice')) return;
  var lang=$('cLang').value;
  var list=cfgResources.voices.filter(function(v){return !lang||v.lang===lang;});
  var cur=$('cVoice').value;
  $('cVoice').innerHTML='<option value="">默认</option>'+list.map(function(v){return '<option value="'+esc(v.id)+'">'+esc(v.name)+'</option>';}).join('');
  if(cur) $('cVoice').value=cur;
}
function fillAgentSel(){
  $('agentSel').innerHTML=agents.map(function(a){return '<option value="'+esc(a.id||a.agent_id)+'">'+esc(a.name||a.agent_name||'未命名')+'</option>';}).join('')||'<option value="">暂无智能体</option>';
  if(agents.length) loadDevices();
}
function goDevices(id){ $('agentSel').value=id; switchPanel('device'); loadDevices(); }

function loadDevices(){
  var aid=$('agentSel').value;
  if(!aid){ $('devList').innerHTML='<div class="empty">请先创建智能体</div>'; return; }
  $('devList').innerHTML='<div class="loading">加载中...</div>';
  api('/agents/'+encodeURIComponent(aid)+'/devices').then(function(data){
    var list=Array.isArray(data)?data:(data&&(data.devices||data.list||data.items))||[];
    if(!list.length){ $('devList').innerHTML='<div class="empty">暂无绑定设备</div>'; return; }
    var h='<table><thead><tr><th>设备MAC/ID</th><th>别名</th><th>状态</th><th>操作</th></tr></thead><tbody>';
    list.forEach(function(d){
      var mac=d.mac_address||d.macAddress||d.mac||d.device_id||d.id||'';
      var alias=d.alias||d.name||d.remark||'';
      h+='<tr><td class="mono">'+esc(mac)+'</td><td>'+esc(alias)+'</td>'
        +'<td>'+(d.online?'<span class="tag">在线</span>':'<span class="tag">-</span>')+'</td>'
        +'<td><button class="small danger" onclick="unbindDev('+esc(aid)+',\''+esc(d.id||d.device_id||mac)+'\')">解绑</button></td></tr>';
    });
    $('devList').innerHTML=h+'</tbody></table>';
  }).catch(function(e){ $('devList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; });
}
function bindDevice(){
  var code=$('devCode').value.trim(), aid=$('agentSel').value;
  if(!code){ toast('请输入设备验证码'); return; }
  if(!aid){ toast('请先选择智能体'); return; }
  api('/agents/'+encodeURIComponent(aid)+'/devices','POST',{verificationCode:code})
    .then(function(){ $('devCode').value=''; toast('绑定成功'); loadDevices(); })
    .catch(function(e){ toast(e.message); });
}
function unbindDev(aid,deviceId){
  if(!confirm('确定解绑该设备?')) return;
  api('/agents/'+encodeURIComponent(aid)+'/devices/delete','POST',{deviceId:deviceId})
    .then(function(){ toast('已解绑'); loadDevices(); })
    .catch(function(e){ toast(e.message); });
}

var API_KEY='xz_custom_apis';
function getApis(){ try{ return JSON.parse(localStorage.getItem(API_KEY)||'[]'); }catch(e){ return []; } }
function saveApis(a){ localStorage.setItem(API_KEY,JSON.stringify(a)); }
function renderApi(){
  var list=getApis();
  if(!list.length){ $('apiList').innerHTML='<div class="empty">暂无自定义 API,点右上角添加</div>'; return; }
  var h='<div class="tbl-wrap"><table class="fixed"><thead><tr><th style="width:20%">名称</th><th style="width:32%">端点</th><th style="width:20%">模型</th><th style="width:28%">操作</th></tr></thead><tbody>';
  list.forEach(function(x,i){
    h+='<tr><td>'+esc(x.name)+'</td><td class="mono">'+esc(x.base||'')+'</td><td>'+esc(x.model||'')+'</td>'
      +'<td><div class="act">'
      +'<button class="small ghost" onclick="openApiEdit('+i+')">编辑</button>'
      +'<button class="small danger" onclick="delApi('+i+')">删除</button>'
      +'</div></td></tr>';
  });
  $('apiList').innerHTML=h+'</tbody></table></div>';
}
function apiForm(x){
  x=x||{};
  return '<div class="field"><label>名称</label><input id="aName" value="'+esc(x.name||'')+'" placeholder="给我个名字" /></div>'
    +'<div class="field"><label>API 端点(Base URL)</label><input id="aBase" value="'+esc(x.base||'')+'" placeholder="https://api.example.com/v1" /></div>'
    +'<div class="field"><label>API Key</label><input id="aKey" value="'+esc(x.key||'')+'" placeholder="sk-..." /></div>'
    +'<div class="field"><label>模型名</label><input id="aModel" value="'+esc(x.model||'')+'" placeholder="模型标识" /></div>';
}
function openApiAdd(){
  openModal('添加自定义 API',apiForm(),'保存',function(){
    var list=getApis();
    list.push({name:$('aName').value.trim(),base:$('aBase').value.trim(),key:$('aKey').value.trim(),model:$('aModel').value.trim()});
    saveApis(list); closeModal(); renderApi(); toast('已添加');
  });
}
function openApiEdit(i){
  var x=getApis()[i];
  openModal('编辑自定义 API',apiForm(x),'保存',function(){
    var list=getApis();
    list[i]={name:$('aName').value.trim(),base:$('aBase').value.trim(),key:$('aKey').value.trim(),model:$('aModel').value.trim()};
    saveApis(list); closeModal(); renderApi(); toast('已保存');
  });
}
function delApi(i){
  if(!confirm('确定删除?')) return;
  var list=getApis(); list.splice(i,1); saveApis(list); renderApi(); toast('已删除');
}

if(getToken()){ showApp(); } else { switchAuth('sms'); showAuth(); }
</script>
</body>
