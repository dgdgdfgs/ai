<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 控制台</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 57px;
    background: #fff; border-bottom: 1px solid #e5e7eb;
    display: flex; align-items: center; padding: 0 20px;
    font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #1a56db; z-index: 9999;
  }
  .bottom-cover {
    position: fixed; left: 0; right: 0; bottom: 0; height: 135px;
    background: #f8fafb; z-index: 9999; pointer-events: none;
  }
</style>
</head>
<body>
<div class="topbar">AI 控制台</div>
<div class="bottom-cover"></div>
<iframe src="https://xiaozhi.me/console/" allow="clipboard-read; clipboard-write; microphone; camera" allowfullscreen></iframe>
</body>
</html>
