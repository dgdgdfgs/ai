<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 控制台</title>
<style>
:root{
  --blue:#1a56db; --blue-dark:#1646b8; --black:#111827; --white:#ffffff;
  --line:#e5e7eb; --muted:#6b7280; --bg:#f5f6f8; --red:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--black);font-size:14px}
a{color:var(--blue)}
.auth-card{max-width:380px;margin:9vh auto;background:var(--white);border:1px solid var(--line);padding:32px}
.auth-card h2{text-align:center;margin:0 0 24px;font-size:20px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.field label{font-size:12px;color:var(--muted)}
input,select{width:100%;padding:10px;border:1px solid var(--line);background:var(--white);color:var(--black);font-size:14px;outline:none;border-radius:0;transition:border-color .18s}
input:focus,select:focus{border-color:var(--blue)}
.captcha-row{display:flex;gap:10px;align-items:stretch}
.captcha-row input{flex:1}
.captcha-row img{width:130px;height:42px;border:1px solid var(--line);cursor:pointer;object-fit:cover}
button{padding:10px 18px;border:1px solid var(--blue);background:var(--blue);color:var(--white);cursor:pointer;font-size:14px;transition:background .18s,border-color .18s}
button:hover{background:var(--blue-dark);border-color:var(--blue-dark)}
button:disabled{opacity:.6;cursor:not-allowed}
button.block{width:100%;margin-top:6px}
button.ghost{background:var(--white);color:var(--black);border-color:var(--line)}
button.ghost:hover{color:var(--blue);border-color:var(--blue);background:var(--white)}
button.danger{background:var(--white);color:var(--black);border-color:var(--line)}
button.danger:hover{background:var(--black);border-color:var(--black);color:var(--white)}
button.small{padding:5px 10px;font-size:12px}
.msg{font-size:13px;min-height:18px;margin-top:10px;text-align:center;color:var(--red)}
.msg.ok{color:var(--blue)}
.app{display:none;max-width:1080px;margin:0 auto;padding:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;background:var(--white);border:1px solid var(--line);padding:14px 20px;margin-bottom:20px}
.topbar h1{margin:0;font-size:18px}
.topbar .right{display:flex;align-items:center;gap:12px}
.topbar .user{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs div{padding:10px 20px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:color .18s,border-color .18s}
.tabs div.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.panel{display:none;background:var(--white);border:1px solid var(--line);padding:20px}
.panel.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel h2{font-size:15px;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.row .field{margin-bottom:0;flex:1 1 180px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.empty{color:var(--muted);padding:14px 0;text-align:center}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--black);color:var(--white);padding:10px 18px;font-size:13px;z-index:99;display:none}
.tag{display:inline-block;padding:2px 8px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div id="authPage" class="auth-card">
  <h2>AI 控制台</h2>
  <div class="field"><label>用户名</label><input id="username" autocomplete="username" /></div>
  <div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" /></div>
  <div class="field"><label>验证码</label>
    <div class="captcha-row">
      <input id="captcha" maxlength="5" placeholder="输入右侧字符" />
      <img id="captchaImg" title="点击刷新" alt="验证码" />
    </div>
  </div>
  <button id="loginBtn" class="block" onclick="doLogin()">登录</button>
  <div id="authMsg" class="msg"></div>
</div>

<div id="appPage" class="app">
  <div class="topbar">
    <h1>AI 控制台</h1>
    <div class="right">
      <span class="user" id="who"></span>
      <button class="ghost small" onclick="doLogout()">退出</button>
    </div>
  </div>
  <div class="tabs">
    <div id="tabDevice" class="active" onclick="switchPanel('device')">设备管理</div>
    <div id="tabVoice" onclick="switchPanel('voice')">音色管理</div>
    <div id="tabPwd" onclick="switchPanel('pwd')">修改密码</div>
  </div>

  <div id="panelDevice" class="panel active">
    <h2>设备绑定</h2>
    <div class="row">
      <div class="field"><label>选择智能体</label><select id="agentSel" onchange="loadDevices(
